# Local development: Directus + PostgreSQL. The SvelteKit dev server runs on the host.
# Settings and secrets come from .env (copy .env.example). Keep the db volume:
# the Directus licence binds to this project, see CLAUDE.md.
name: achieve

services:
  database:
    image: postgres:17.11-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

  directus:
    image: directus/directus:12.6.0
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    ports:
      - "127.0.0.1:8055:8055"
    env_file: .env
    environment:
      DB_CLIENT: pg
      DB_HOST: database
      DB_PORT: 5432
      PUBLIC_URL: http://localhost:8055
      WEBSOCKETS_ENABLED: "false"
      GRAPHQL_INTROSPECTION: "false"
      CORS_ENABLED: "false"
    volumes:
      - uploads:/directus/uploads
      - ./directus:/directus/project
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8055/server/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  db_data:
  uploads:
